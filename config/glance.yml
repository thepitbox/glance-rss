# Reuters-inspired palette: charcoal background, Reuters orange (#FA6400) accent and white text.
# The white background theme is still available from the theme picker as "default-light".
theme:
  background-color: 0 0 10
  primary-color: 24 100 49
  negative-color: 0 75 60
  contrast-multiplier: 1.75
  # only offer this theme and the white background one in the theme picker
  hide-default-dark: true

document:
  # headlines in white (orange on hover) instead of the accent color, only on dark themes
  # so that the white background theme keeps dark headlines
  head: |
    <style>
      [data-scheme="dark"] .color-primary-if-not-visited:not(:visited) { color: var(--color-text-highlight); }
      .color-primary-if-not-visited:hover { color: var(--color-primary); }
      /* price increases in green, only in the markets widget */
      .widget-type-markets { --color-positive: hsl(145, 355%, 30%); }
    </style>

pages:
  - name: Home
    # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
    # hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday
      - size: full
        widgets:
          - type: group
            widgets:
              - type: rss
                title: Tech News
                feeds:
                  - url: https://theverge.com/rss/index.xml
                    title: The Verge
                  - url: https://techcrunch.com/feed/
                    title: TechCrunch
                  - url: https://arstechnica.com/feed
                    title: Ars Technica
              - type: rss
                title: World News
                feeds:
                  - url: https://news.google.com/rss/search?q=Ap%20news&amp;hl=en-US&amp;gl=US&amp;ceid=US%3Aen
                    title: AP News
                  - url: https://news.google.com/rss/search?q=site%3Areuters.com&amp;hl=en-US&amp;gl=US&amp;ceid=US%3Aen
                    title: Reuters
              - type: rss
                title: Auto News
                feeds:
                  - url: http://www.electrive.net/feed
                    title: Elective
      - size: small
        widgets:
          - type: weather
            location: Saarbrücken, Germany
            units: metric # alternatively "imperial"
            hour-format: 12h # alternatively "24h"
            # Optionally hide the location from being displayed in the widget
            # hide-location: true
          - type: markets
            # symbols are from Yahoo Finance (https://finance.yahoo.com)
            markets:
              - symbol: GC=F
                name: Gold
              - symbol: SI=F
                name: Silver
              - symbol: ^GSPC
                name: S&P 500
              - symbol: VWCE.DE
                name: VG World
